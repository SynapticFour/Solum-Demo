# Live Stage-1 stack: build pinned sidecar, run authz + audit + consent smokes.
# Runs on pull_request so a broken proof dies before merge (cold Rust compile ~5–45 min).
name: smoke-stage1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-stage1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bring up Stage-1
        run: |
          make up
          for i in $(seq 1 90); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'X-Solum-Actor: practitioner/amina' \
              -H 'X-Solum-Capability: solum:audit:export' \
              http://127.0.0.1:8080/v1/audit/export || echo 000)
            harness=$(curl -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/demo/health || echo 000)
            if [ "$code" = "200" ] && [ "$harness" = "200" ]; then
              echo "ready after ${i} attempts (sidecar=${code} harness=${harness})"
              exit 0
            fi
            sleep 5
          done
          echo "sidecar/harness not ready (last sidecar=${code:-?} harness=${harness:-?})"
          docker compose logs --tail=80
          exit 1

      - name: smoke-ci
        run: make smoke-ci

      - name: Teardown
        if: always()
        run: docker compose down -v
