# Lightweight gate: pins, license, shell syntax, harness unit tests.
# Full Stage-1 Docker smokes: smoke-stage1.yml (also on pull_request).
name: smoke-syntax

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: make check
        run: make check
