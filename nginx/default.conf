# Reverse-proxy: one origin for the dashboard, Solum sidecar (/v1/*), and
# the demo-only tamper harness (/demo/*). Keeps browser fetch() simple and
# avoids CORS against the sidecar (which does not emit CORS headers).

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Solum sidecar (product surface — pinned baseline binary).
    location /v1/ {
        proxy_pass http://sidecar:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DEMO HARNESS ONLY — filesystem tampering for Scenario 2.
    # Not part of Solum. See demo-harness/ and README.
    location /demo/ {
        proxy_pass http://demo-harness:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
