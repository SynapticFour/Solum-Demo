# Solum-Demo — local interactive demo only.
#
# Sidecar runs in --ephemeral mode with SOLUM_ALLOW_EPHEMERAL=1 and
# config/profiles/dev-local.toml from the pinned Solum tag.
#
# Demo simplification (documented intentionally): ephemeral test keys live
# only in process memory. Real deployments use CustomerHeld (--keys-dir) or
# AWS-KMS (library path today) — see Solum's docs/customer/SECURITY-OVERVIEW.md
# and docs/customer/SIDECAR-INTEGRATION.md. This compose file is not a
# production topology.
#
# The demo-harness service mutates audit.jsonl on the filesystem. That is
# DEMO HARNESS CODE in this repository only — never part of Solum / the
# sidecar API (the product deliberately has no tamper endpoint).

services:
  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOLUM_TAG: stage1-baseline-sidecar-custody-2026-08-01
        RUST_VERSION: "1.91.1"
    environment:
      SOLUM_SIDECAR_TOKEN: ${SOLUM_SIDECAR_TOKEN:-solum-demo-local-token-not-for-production}
      SOLUM_ALLOW_EPHEMERAL: "1"
      SOLUM_PROFILE: /etc/solum/dev-local.toml
      SOLUM_AUDIT: /data/audit.jsonl
      SOLUM_CONSENT_STORE: /data/consent.jsonl
      SOLUM_SIDECAR_BIND: 0.0.0.0:8787
      RUST_LOG: info
    volumes:
      - solum-demo-data:/data
    expose:
      - "8787"
    # No HTTP healthcheck binary in the slim sidecar image; dashboard/nginx
    # simply retries until the sidecar accepts connections.

  # ---------------------------------------------------------------------------
  # DEMO HARNESS ONLY — not Solum.
  # Mutates /data/audit.jsonl directly on the shared volume so visitors can
  # see chain breakage. Solum's sidecar has no "tamper" HTTP route by design.
  # ---------------------------------------------------------------------------
  demo-harness:
    build:
      context: ./demo-harness
    environment:
      AUDIT_PATH: /data/audit.jsonl
      HARNESS_BIND: 0.0.0.0:8790
    volumes:
      - solum-demo-data:/data
    expose:
      - "8790"
    depends_on:
      - sidecar

  dashboard:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sidecar
      - demo-harness

volumes:
  solum-demo-data:
