# Solum-Demo — local interactive demo only. Not a customer evaluation.
#
# Sidecar runs in --ephemeral mode with SOLUM_ALLOW_EPHEMERAL=1 and
# config/profiles/dev-local.toml. That profile allows client-asserted
# capability[] and ephemeral keys. Solum's own profile text forbids using
# it for customer evaluations — this compose file is the matching local
# developer walkthrough, not a pilot.
#
# Bind: 127.0.0.1 only. nginx injects X-Solum-Sidecar-Token so the UI
# source does not contain the secret. The demo-harness mutates audit.jsonl
# on the filesystem (DEMO ONLY — never part of Solum).

services:
  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOLUM_REF: ${SOLUM_REF:-6b4519c98f5c1e905ab5cf3f517787021d1e2604}
        RUST_VERSION: "1.91.1"
    environment:
      SOLUM_SIDECAR_TOKEN: ${SOLUM_SIDECAR_TOKEN:-solum-demo-local-token-not-for-production}
      SOLUM_ALLOW_EPHEMERAL: "1"
      SOLUM_PROFILE: /etc/solum/dev-local.toml
      SOLUM_AUDIT: /data/audit.jsonl
      SOLUM_CONSENT_STORE: /data/consent.jsonl
      SOLUM_SIDECAR_BIND: 0.0.0.0:8787
      RUST_LOG: info
    volumes:
      - solum-demo-data:/data
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/v1/audit/export | grep -Eq '401|403|200'",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  # ---------------------------------------------------------------------------
  # DEMO HARNESS ONLY — not Solum.
  # Mutates /data/audit.jsonl directly on the shared volume so visitors can
  # see chain breakage. Solum's sidecar has no "tamper" HTTP route by design.
  # Runs as uid 10001 to match the sidecar so tamper does not chown the file
  # away from the writer.
  # ---------------------------------------------------------------------------
  demo-harness:
    build:
      context: ./demo-harness
    environment:
      AUDIT_PATH: /data/audit.jsonl
      HARNESS_BIND: 0.0.0.0:8790
      SOLUM_SIDECAR_TOKEN: ${SOLUM_SIDECAR_TOKEN:-solum-demo-local-token-not-for-production}
    volumes:
      - solum-demo-data:/data
    expose:
      - "8790"
    depends_on:
      sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/demo/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    environment:
      SOLUM_SIDECAR_TOKEN: ${SOLUM_SIDECAR_TOKEN:-solum-demo-local-token-not-for-production}
    command:
      - /bin/sh
      - -c
      - envsubst '$$SOLUM_SIDECAR_TOKEN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:${SOLUM_DEMO_PORT:-8080}:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      sidecar:
        condition: service_healthy
      demo-harness:
        condition: service_healthy

volumes:
  solum-demo-data:
